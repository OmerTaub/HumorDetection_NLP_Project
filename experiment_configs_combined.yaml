# # Default base configuration for combined dataset
base_config:
  model_name: "distilbert-base-uncased"
  dataset: "humor"  # Use the processed humor dataset (humor_train.csv, humor_val.csv, humor_test.csv)
  max_seq_length: 64  # Increased for diverse joke lengths
  batch_size: 64     # Larger batch for bigger dataset
  random_seed: 42
  epochs: 1          # Fewer epochs due to larger dataset size

# # Experiment 1: Setup-Punchline Attention Analysis on Combined Dataset
