# Experiment 2: Setup-Punchline Segmentation for Combined Dataset
setup_ratio_optimization:
  description: "Find optimal ratio for dividing jokes into setup and punchline"
  base_params:
    experiment_category: "setup_ratio_optimization_combined"
    spa_heads: 1
    dropout_rate: 0.3
    freeze_backbone: false
    learning_rate: 2e-5
  
  variations:
    - setup_ratio: 0.1
      experiment_id: "combined_setup_ratio_10"
    - setup_ratio: 0.5
      experiment_id: "combined_setup_ratio_50"
    - setup_ratio: 0.7
      experiment_id: "combined_setup_ratio_70"
    - setup_ratio: 0.9
      experiment_id: "combined_setup_ratio_90"

# Experiment 3: Backbone Freezing Strategy for Combined Dataset
backbone_freezing:
  description: "Analyze effect of freezing BERT backbone with different learning rates"
  base_params:
    experiment_category: "backbone_freezing_combined"
    spa_heads: 1
    setup_ratio: 0.7
    dropout_rate: 0.3
  
  variations:
    - freeze_backbone: true
      learning_rate: 2e-5
      experiment_id: "combined_freeze_true_lr_2e5"
    - freeze_backbone: false
      learning_rate: 2e-5
      experiment_id: "combined_freeze_false_lr_2e5"


# Experiment 4: Regularization Study for Combined Dataset
regularization_study:
  description: "Study effect of dropout on different model components"
  base_params:
    experiment_category: "regularization_study_combined"
    spa_heads: 1
    setup_ratio: 0.7
    freeze_backbone: false
    learning_rate: 2e-5
  
  variations:
    - dropout_rate: 0.1
      experiment_id: "combined_dropout_01_low"
    - dropout_rate: 0.2
      experiment_id: "combined_dropout_02_standard"
    - dropout_rate: 0.3
      experiment_id: "combined_dropout_03_moderate"
    - dropout_rate: 0.4
      experiment_id: "combined_dropout_04_high"
    - dropout_rate: 0.5
      experiment_id: "combined_dropout_05_very_high"


# Baseline comparison experiment
baseline_comparison:
  description: "Compare different model architectures on combined dataset"
  base_params:
    experiment_category: "baseline_comparison_combined"
    setup_ratio: 0.7
    dropout_rate: 0.2
    learning_rate: 2e-5
    epochs: 1
  
  variations:
    - spa_heads: 0  # No SPA mechanism (standard BERT)
      freeze_backbone: false
      experiment_id: "combined_standard_bert"
    - spa_heads: 1  # Single head SPA
      freeze_backbone: false
      experiment_id: "combined_spa_single"
    - spa_heads: 2  # Multi-head SPA
      freeze_backbone: false
      experiment_id: "combined_spa_multi"
    - spa_heads: 4  # High SPA
      freeze_backbone: false
      experiment_id: "combined_spa_high"

# Quick test configuration for development
quick_test:
  description: "Quick test with minimal epochs for development on combined dataset"
  base_params:
    experiment_category: "quick_test_combined"
    spa_heads: 1
    setup_ratio: 0.7
    dropout_rate: 0.3
    freeze_backbone: false
    learning_rate: 2e-5
    epochs: 1
    batch_size: 16
    max_seq_length: 48  # Shorter for faster processing
  
  variations:
    - experiment_id: "combined_quick_test_proposed"

# Sample dataset experiment (using a subset for even faster testing)
sample_test:
  description: "Test on sample combined dataset for rapid iteration"
  base_params:
    experiment_category: "sample_test_combined"
    spa_heads: 1
    setup_ratio: 0.7
    dropout_rate: 0.3
    freeze_backbone: false
    learning_rate: 2e-5
    epochs: 1
    batch_size: 8
    max_seq_length: 48
    # Could be used with a subset of the training data
  
  variations:
    - experiment_id: "combined_sample_quick_test"

# Comprehensive model comparison
comprehensive_comparison:
  description: "Comprehensive comparison of different configurations on combined dataset"
  base_params:
    experiment_category: "comprehensive_comparison_combined"
    dropout_rate: 0.3
    learning_rate: 2e-5
    epochs: 2
  
  variations:
    # Standard configurations
    - spa_heads: 0
      setup_ratio: 0.7
      freeze_backbone: false
      experiment_id: "combined_standard_baseline"
    
    # SPA variations
    - spa_heads: 2
      setup_ratio: 0.6
      freeze_backbone: false
      experiment_id: "combined_spa_setup_60"
    
    - spa_heads: 2
      setup_ratio: 0.7
      freeze_backbone: false
      experiment_id: "combined_spa_setup_70"
    
    - spa_heads: 3
      setup_ratio: 0.7
      freeze_backbone: false
      experiment_id: "combined_spa_multi_head"
    
    # Frozen backbone experiments
    - spa_heads: 2
      setup_ratio: 0.7
      freeze_backbone: true
      learning_rate: 5e-5
      experiment_id: "combined_frozen_backbone"
